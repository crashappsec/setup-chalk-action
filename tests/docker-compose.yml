services:
  action:
    build:
      context: .
      args:
        BASE: ${BASE:-alpine}
    working_dir: /action
    user: ${USER:-root}
    environment:
      CHALK_PASSWORD: ${CHALK_PASSWORD:-}
      __CHALK_TESTING__: ${__CHALK_TESTING__:-}
    volumes:
      - ../:/action
      - ../../chalk:/chalk
